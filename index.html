<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>Nexora IA | Análise de Entradas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="brand">
            <span class="brand-icon">N</span>
            <div>
                <h1>NEXORA <span>IA</span></h1>
                <p>PLATAFORMA DE ANÁLISE</p>
            </div>
        </div>

        <div class="analysis-panel">
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Sistema pronto</span>
            </div>

            <div class="analyzer">
                <div
                    class="loader"
                    id="loader"
                    role="button"
                    tabindex="0"
                    aria-label="Analisar entrada"
                    title="Analisar entrada"
                >
                    <span>↻</span>
                </div>

                <div class="result-area">
                    <span class="result-label" id="resultLabel">
                        CLIQUE PARA ANALISAR
                    </span>
                    <strong class="result" id="result"></strong>
                </div>
            </div>

            <div class="timer">
                <span>PRÓXIMA ANÁLISE</span>
                <strong id="countdown">01:00</strong>
            </div>
        </div>
    </header>

    
<main class="platform">
    <div class="url-screen" id="urlScreen">
        <div class="url-card">
            <div class="url-logo">N</div>

            <h2>Conecte sua plataforma</h2>
            <p>Insira a URL da plataforma que deseja visualizar.</p>

            <form id="urlForm">
                <input
                    type="url"
                    id="platformUrl"
                    placeholder="https://exemplo.com"
                    aria-label="URL da plataforma"
                    required
                >

                <button type="submit" id="openPlatform">
                    Abrir plataforma
                    <span>→</span>
                </button>
            </form>

            <p class="url-error" id="urlError"></p>
        </div>
    </div>

    <iframe
        id="platformFrame"
        title="Plataforma de análise"
        allowfullscreen
    ></iframe>

    <div class="frame-overlay" id="frameOverlay">
        <span>Carregando plataforma...</span>
    </div>
</main>
</body>
</html>


    <script src="script.js"></script>
</body>
</html>
